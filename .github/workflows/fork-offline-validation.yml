name: Fork offline PR validation

on:
  push:
    branches:
      - main
      - 'integration/**'
      - 'ci/**'
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main
      - feat/pnd-archive-core
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or commit to validate (leave empty for selected ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.target_ref || 'automatic' }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12', '3.13']
    env:
      CI: 'true'
      CEZ_EMAIL: ''
      CEZ_PASSWORD: ''
      CEZ_ELECTROMETER_ID: ''
      CEZ_EAN: ''
      CEZ_ELECTROMETERS: '[]'
      MQTT_USER: ''
      MQTT_PASSWORD: ''
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out selected source without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install public test dependencies and socket guard
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt pytest-socket
          python -m pip check

      - name: Syntax-compile sources and tests
        run: |
          python -m compileall -q addon/src tests
          bash -n addon/run.sh

      - name: Run synthetic tests with all network sockets blocked
        run: python -m pytest -q -o addopts='' --disable-socket --allow-unix-socket --tb=short tests
