name: CEZ PND
version: "0.4.1"
slug: cez-pnd
description: "CEZ PND data integration for Home Assistant via MQTT Discovery"
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
services:
  - "mqtt:want"
options:
  email: ""
  password: ""
  electrometer_id: ""
  ean: ""
  electrometers: "[]"
  archive_enabled: false
  archive_start_date: ""
  archive_days_per_cycle: 1
  archive_meter_ids: "[]"
  import_ean: ""
  export_ean: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  email: str
  password: password
  electrometer_id: str?
  ean: str?
  electrometers: str?
  archive_enabled: bool
  archive_start_date: str?
  archive_days_per_cycle: int(1,62)
  archive_meter_ids: str?
  import_ean: str?
  export_ean: str?
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password
map:
  - "share:rw"
