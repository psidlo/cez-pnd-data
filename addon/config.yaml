name: CEZ PND
version: "0.4.1"
slug: cez-pnd
description: "CEZ PND data integration for Home Assistant via MQTT Discovery"
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
services:
  - "mqtt:need"
options:
  email: ""
  password: ""
  electrometer_id: ""
  ean: ""
  electrometers: "[]"
  archive_enabled: false
  archive_start_date: ""
  archive_max_days_per_cycle: 1
schema:
  email: str
  password: password
  electrometer_id: str?
  ean: str?
  electrometers: str?
  archive_enabled: bool
  archive_start_date: str?
  archive_max_days_per_cycle: int(1,62)
map:
  - "share:rw"
